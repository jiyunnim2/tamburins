<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAMBURINS | 주문서</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/style.css" media="(min-width: 1280px)">
<link rel="stylesheet" href="css/account.css" media="(min-width: 1280px)">
<link rel="stylesheet" href="css/mobile.css" media="(max-width: 1279.98px)">
</head>
<body class="acc-page">

<div data-site-header data-variant="light"></div>

<main class="acc-wrap">
  <div class="order-steps">
    <button type="button" class="m-only order-steps__back" data-back aria-label="뒤로 가기"><img src="assets/icons/m-back-20.svg" alt=""></button>
    <h1 class="acc-title">주문서</h1>
    <i aria-hidden="true"></i>
    <ol>
      <li>1. 주문자 정보</li>
      <li class="is-active" aria-current="step">2. 배송 정보</li>
      <li>3. 결제 수단</li>
      <li>4. 주문 완료</li>
    </ol>
  </div>

  <div class="order" data-order>
    <form class="order__form" id="shippingForm" novalidate>
      <h2 class="acc-title">배송 정보를 확인해 주세요.</h2>

      <div class="order-field">
        <label for="recipient">수령인*</label>
        <input id="recipient" name="recipient_name" placeholder="이름" autocomplete="name" required>
        <button type="button" class="acc-link" data-same-as-buyer>주문자 정보와 동일</button>
      </div>
      <div class="order-field">
        <label for="phone">휴대폰 번호*</label>
        <input id="phone" name="phone" placeholder="‘-’ 없이 숫자만 입력" inputmode="numeric" autocomplete="tel" maxlength="11" required>
      </div>
      <div class="order-field order-field--tight">
        <label for="address">배송지*</label>
        <input id="address" name="address" autocomplete="street-address" required readonly>
        <button type="button" class="order-field__find" data-find-address>주소 찾기</button>
      </div>
      <div class="order-field order-field--tight">
        <label for="addressDetail">배송지 상세 정보*</label>
        <input id="addressDetail" name="address_detail" placeholder="상세 동, 호수, 건물명을 반드시 기재해주세요." required>
        <button type="button" class="acc-link" data-recent>최근 배송지</button>
      </div>
      <div class="order-field">
        <label for="request">배송 요청사항</label>
        <select id="request" name="request" required>
          <option value="" disabled selected hidden></option>
          <option>문 앞에 놓아주세요.</option>
          <option>경비실에 맡겨주세요.</option>
          <option>배송 전 연락 바랍니다.</option>
          <option>택배함에 넣어주세요.</option>
        </select>
        <img class="order-field__select-icon" src="assets/icons/icon-arrow-forward-select.svg" alt="">
      </div>

      <label class="order-check"><input type="checkbox" name="save_default"> 기본 배송지로 지정</label>
      <p class="order__error" role="alert" data-error hidden></p>
    </form>

    <aside class="order__aside">
      <h2 class="acc-title">주문 요약</h2>
      <div class="order-sum" data-summary>
        <button type="button" class="order-sum__toggle" aria-expanded="false" data-summary-toggle>
          <span>총 상품 : <span data-count>4</span>개</span>
          <img src="assets/icons/icon-summary-down.svg" alt="" data-summary-icon>
        </button>
        <div class="order-sum__items" data-items-wrap><div class="order-sum__items-inner" data-items></div></div>
        <div class="order-sum__totals">
          <dl class="acc-amounts">
            <dt>주문금액</dt><dd data-subtotal>166,000원</dd>
            <dt>배송비 <span class="acc-chip">3만원 이상 구매시 무료</span></dt><dd data-shipping>0원</dd>
          </dl>
          <div class="acc-total"><p>총 주문금액</p><p data-total>166,000원</p></div>
          <p class="order-sum__points"><span>구매 적립금</span><span data-points>3500 P</span></p>
        </div>
        <div class="order-sum__actions">
          <a href="cart.html" class="acc-btn">이전 단계로</a>
          <button type="submit" form="shippingForm" class="acc-btn acc-btn--solid" data-submit>저장하고 다음 단계로</button>
        </div>
        <ul class="order-sum__notice">
          <li>쇼핑백 구매는 장바구니에서 가능하며 제품 개수만큼 구매하실 수 있습니다.</li>
          <li>주문일로부터 출고까지 1~2 영업일 소요됩니다.</li>
        </ul>
      </div>
    </aside>
  </div>

  <section class="order-done" data-done hidden>
    <h2>주문이 완료되었습니다.</h2>
    <p data-done-text></p>
    <a href="mypage.html" class="acc-btn acc-btn--solid">주문 내역 보기</a>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/layout.js"></script>
<script src="js/store.js"></script>
<script src="js/order.js"></script>
</body>
</html>
